services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      AUTH_DB_PATH: /app/data/auth.sqlite
      APP_BASE_URL: https://${APP_DOMAIN:?Set APP_DOMAIN in .env.production}
    expose:
      - "3000"
    volumes:
      - auth_data:/app/data
      - auth_backups:/backups
    init: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file:
      - .env.production
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    init: true
    security_opt:
      - no-new-privileges:true

volumes:
  auth_data:
  auth_backups:
  caddy_data:
  caddy_config:
